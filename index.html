<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="idle">
  <canvas id="sky" aria-hidden="true"></canvas>

  <main>
    <form id="search" role="search">
      <label for="city" class="sr-only">City name</label>
      <input id="city" type="text" placeholder="Search a city" autocomplete="off" required>
      <button type="submit" class="solid">Search</button>
      <button type="button" id="locate">Use my location</button>
    </form>

    <p id="status" role="status" aria-live="polite">Search a city to see its weather.</p>

    <section id="weather" hidden>
      <div class="hero">
        <div>
          <p id="place"></p>
          <h1 id="condition"></h1>
        </div>
        <div class="now">
          <p id="temp"></p>
          <button type="button" id="unit" aria-pressed="false" title="Switch between °C and °F">Show °F</button>
        </div>
      </div>

      <dl class="details">
        <div><dt>Feels like</dt><dd id="feels"></dd></div>
        <div><dt>Humidity</dt><dd id="humidity"></dd></div>
        <div><dt>Wind</dt><dd id="wind"></dd></div>
      </dl>

      <h2>Next 5 days</h2>
      <ol id="forecast"></ol>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
